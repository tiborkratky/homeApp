name: PR Notification to Slack

on:
  pull_request:
    types: [opened]
  pull_request_review:
    types: [submitted]
  issue_comment:
    types: [created]
  workflow_dispatch:

jobs:
  slack-pr:
    runs-on: ubuntu-latest

    steps:

      # Step 1: Post Slack message when PR is opened
      - name: Post PR message
        id: post_slack
        if: ${{ github.event_name == 'pull_request' && github.event.action == 'opened' }}
        uses: slackapi/slack-github-action@v1.26.0
        with:
          channel-id: 'C0A47M3V90B'
          slack-message: |
            :bell: *New PR opened in repository:* ${{ github.event.repository.name }}
            *Title:* ${{ github.event.pull_request.title }}
            *Author:* ${{ github.event.pull_request.user.login }}
            *Link:* ${{ github.event.pull_request.html_url }}
        env:
          SLACK_BOT_TOKEN: ${{ secrets.CHATBOT }}

      - name: Save Slack ts in PR comment
        if: ${{ github.event_name == 'pull_request' && github.event.action == 'opened' }}
        uses: peter-evans/create-or-update-comment@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}
          issue-number: ${{ github.event.pull_request.number }}
          body: "SLACK_TS=${{ steps.post_slack.outputs.ts }}"
          edit-mode: replace

      # Step 3: Get Slack ts from PR comment for reactions
      - name: Get Slack ts from PR comment
        if: ${{ github.event_name != 'pull_request' || github.event.action != 'opened' }}
        id: get_ts
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });
            const tsComment = comments.data.find(c => c.body.startsWith("SLACK_TS="));
            return tsComment ? tsComment.body.replace("SLACK_TS=", "") : "";
          result-encoding: string

      - name: Debug Slack ts
        if: ${{ github.event_name != 'pull_request' || github.event.action != 'opened' }}
        run: |
          echo "Slack ts: $STEP_TS"
        env:
          STEP_TS: ${{ steps.get_ts.outputs.result }}



      # Step 5: Add approval reaction
      - name: Add approval reaction
        if: ${{ github.event_name == 'pull_request_review' }}
        run: |
          if [ -n "${{ steps.get_ts.outputs.result }}" ] && [ "${{ github.event.review.state }}" == "approved" ]; then
            echo "Adding :white_check_mark: reaction"
            gh run api \
              -H "Authorization: Bearer $SLACK_BOT_TOKEN" \
              -X POST \
              -F channel='C0A47M3V90B' \
              -F name='white_check_mark' \
              -F timestamp='${{ steps.get_ts.outputs.result }}' \
              https://slack.com/api/reactions.add
          else
            echo "Skipping reaction"
          fi
        env:
          SLACK_BOT_TOKEN: ${{ secrets.CHATBOT }}

      # Step 6: Add comment reaction
      - name: Add comment reaction
        if: ${{ github.event_name == 'issue_comment' }}
        run: |
          if [ -n "${{ steps.get_ts.outputs.result }}" ]; then
            echo "Adding :speech_balloon: reaction"
            gh run api \
              -H "Authorization: Bearer $SLACK_BOT_TOKEN" \
              -X POST \
              -F channel='C0A47M3V90B' \
              -F name='speech_balloon' \
              -F timestamp='${{ steps.get_ts.outputs.result }}' \
              https://slack.com/api/reactions.add
          else
            echo "Skipping reaction"
          fi
        env:
          SLACK_BOT_TOKEN: ${{ secrets.CHATBOT }}
