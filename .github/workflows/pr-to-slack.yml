name: PR Notification to Slack

on:
  pull_request:
    types: [opened]
  pull_request_review:
    types: [submitted]
  issue_comment:
    types: [created]
  workflow_dispatch:

jobs:
  slack-pr:
    runs-on: ubuntu-latest

    steps:

      # Step 1: Post Slack message when PR is opened
      - name: Post PR message
        id: post_slack
        if: ${{ github.event_name == 'pull_request' && github.event.action == 'opened' }}
        uses: slackapi/slack-github-action@v1.26.0
        with:
          channel-id: 'C0A47M3V90B'
          slack-message: |
            :bell: *New PR opened in repository:* ${{ github.event.repository.name }}
            *Title:* ${{ github.event.pull_request.title }}
            *Author:* ${{ github.event.pull_request.user.login }}
            *Link:* ${{ github.event.pull_request.html_url }}
        env:
          SLACK_BOT_TOKEN: ${{ secrets.CHATBOT }}

      - name: Add approval reaction
        if: ${{ github.event_name == 'pull_request_review' && github.event.review.state == 'approved' }}
        run: |
          curl -X POST \
            -H "Authorization: Bearer ${{ secrets.CHATBOT }}" \
            -H "Content-type: application/json" \
            --data '{"channel":"C0A47M3V90B","name":"white_check_mark","timestamp":"<TS_FROM_PREVIOUS_STEP>"}' \
            https://slack.com/api/reactions.add

