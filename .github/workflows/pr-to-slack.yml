name: Slack Test

on:
  workflow_dispatch:

jobs:
  test-slack:
    runs-on: ubuntu-latest
    steps:
      - name: Test Slack message
        uses: slackapi/slack-github-action@v1.26.0
        with:
          channel-id: 'C0A47M3V90B'
          slack-message: 'Hello from GitHub Actions :tada:'
        env:
          SLACK_BOT_TOKEN: ${{ secrets.CHATBOT }}
