name: PR Notification to Slack

on:
  pull_request:
    types: [opened]
  pull_request_review:
    types: [submitted]
  issue_comment:
    types: [created]
  workflow_dispatch:   # Optional manual trigger for testing

jobs:
  slack-pr:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Post PR message when PR is opened
      - name: Post PR opened message
        id: post_slack
        if: github.event_name == 'pull_request' && github.event.action == 'opened'
        uses: slackapi/slack-github-action@v1.26.0
        with:
          channel-id: 'C0A47M3V90B'  # Replace with your Slack channel ID
          slack-message: |
            :bell: *New PR opened in repository:* ${{ github.event.repository.name }}
            *Title:* ${{ github.event.pull_request.title }}
            *Author:* ${{ github.event.pull_request.user.login }}
            *Link:* ${{ github.event.pull_request.html_url }}
        env:
          SLACK_BOT_TOKEN: ${{ secrets.CHATBOT }}

      # Step 2: Add reaction for PR approvals
      - name: Add approval reaction
        if: github.event_name == 'pull_request_review' && github.event.review.state == 'approved'
        uses: slackapi/slack-github-action@v1.26.0
        with:
          channel-id: 'C0A47M3V90B'
          reaction-name: 'white_check_mark'
          ts: ${{ github.event.pull_request.slack_ts || steps.post_slack.outputs.ts }}
        env:
          SLACK_BOT_TOKEN: ${{ secrets.CHATBOT }}

      # Step 3: Add reaction for comments
      - name: Add comment reaction
        if: github.event_name == 'issue_comment'
        uses: slackapi/slack-github-action@v1.26.0
        with:
          channel-id: 'C0A47M3V90B'
          reaction-name: 'speech_balloon'
          ts: ${{ github.event.issue.slack_ts || steps.post_slack.outputs.ts }}
        env:
          SLACK_BOT_TOKEN: ${{ secrets.CHATBOT }}
